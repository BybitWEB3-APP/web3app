<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bybit WEB3</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --bg2:#121316; --bg3:#1E1F23; --text:#F4F5F6; --hint:#8B8E95; --line:#26272B;
  --accent:#F7A707; --accent-2:#FFBE4D; --accent-text:#000000; --up:#1FD187; --down:#FF5666;
  --up-bg:rgba(31,209,135,.14); --down-bg:rgba(255,86,102,.14);
  --sheet:#0E0F11; --scrim:rgba(0,0,0,.72);
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000000 } }
:root[data-theme="dark"]{ --bg:#000000 }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding:10px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* top */
.top{display:flex;align-items:center;gap:8px;padding:4px 0 14px}
.acct{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;max-width:62%}
.acct #uname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ava{width:28px;height:28px;border-radius:50%;background:conic-gradient(from 210deg,#F7A707,#FFD36B,#F7A707);display:grid;place-items:center;color:var(--accent-text);font-weight:800;font-size:13px;flex:none}
.sp{flex:1}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;color:var(--hint)}
.icon-btn svg{width:18px;height:18px}

/* balance card */
.card{position:relative;border-radius:22px;padding:18px 18px 0;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.card::before{content:"";position:absolute;inset:-40% -20% auto auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(247,167,7,.22),transparent 65%);pointer-events:none}
.bal-label{font-size:13px;color:var(--hint);display:flex;align-items:center;gap:6px}
.bal-num{font-weight:800;font-size:clamp(32px,10vw,42px);letter-spacing:-.025em;line-height:1.1;margin:6px 0 8px}
.bal-num .cents{color:var(--hint);font-weight:700}
.pnl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--hint)}
.chg{display:inline-block;padding:3px 8px;border-radius:8px;font-weight:700;font-size:13px}
.chg.up{color:var(--up);background:var(--up-bg)} .chg.down{color:var(--down);background:var(--down-bg)}
.up{color:var(--up)} .down{color:var(--down)}
.tape{height:64px;margin:10px -18px 0;display:block;width:calc(100% + 36px)}

/* actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 20px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--hint)}
.act span.i{width:50px;height:50px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;transition:transform .12s}
.act:first-child span.i{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.act:active span.i{transform:scale(.92)}
.act svg{width:20px;height:20px}

/* section head */
.sec{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--hint)}
.seg button[aria-selected="true"]{background:var(--bg3);color:var(--text)}
.sec small{font-size:12px;color:var(--hint)}
h1.page{font-size:24px;font-weight:800;margin:6px 0 4px;letter-spacing:-.01em}
.colhead{display:flex;justify-content:space-between;font-size:12px;color:var(--hint);padding:10px 0 2px}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.coin{position:relative;overflow:hidden;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.coin i{font-style:normal;position:relative;z-index:0}
.coin img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:inherit;z-index:1}
.row .mid{flex:1;min-width:0}
.row .mid b{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700}
.row .mid small{font-size:13px;color:var(--hint)}
.tagnet{font-size:10px;font-weight:600;color:var(--hint);background:var(--bg3);padding:2px 6px;border-radius:6px}
.row .end{text-align:right}
.row .end b{display:block;font-size:15px;font-weight:700}
.row .end small{font-size:13px;color:var(--hint)}
.spark{width:60px;height:26px;flex:none}
.tx-ic{width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;flex:none}
.tx-ic svg{width:18px;height:18px}
.chg.wide{min-width:76px;text-align:center;padding:7px 0}
.empty{padding:40px 8px;text-align:center;color:var(--hint);font-size:14px}
.demo{font-size:12px;color:var(--hint);text-align:center;margin-top:18px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 10px;font-size:11px;font-weight:600;color:var(--hint)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--accent-2)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:480px;margin:0 auto;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--bg3);margin:0 auto 12px}
.sheet h2{font-size:18px;font-weight:800;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{width:30px;height:30px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;color:var(--hint);flex:none}
.close svg{width:14px;height:14px}
.field{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.field:focus-within{border-color:var(--accent)}
.field label{display:block;font-size:12px;color:var(--hint);margin-bottom:4px}
.field input{width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:16px;outline:none;padding:2px 0}
.field .line{display:flex;align-items:center;gap:8px}
.field .big{font-size:24px;font-weight:800}
.pill{background:var(--bg3);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--accent-2);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:12px;background:var(--bg2);font-weight:700;font-size:14px;flex:none;border:1px solid var(--line)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:rgba(247,167,7,.12)}
.chip .coin{width:24px;height:24px;font-size:10px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 2px;color:var(--hint)}
.kv b{color:var(--text);font-weight:600}
.err{color:var(--down);font-size:13px;min-height:18px;margin:2px 2px 8px}
.primary{width:100%;background:var(--accent);color:var(--accent-text);border-radius:14px;padding:15px;font-weight:800;font-size:16px;margin-top:6px}
.primary:disabled{opacity:.35;cursor:default}
.ghost{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:700;font-size:15px}
.danger{color:var(--down)}
.swapmid{display:flex;justify-content:center;margin:-17px 0 -7px;position:relative;z-index:1}
.swapmid button{width:40px;height:40px;border-radius:12px;background:var(--bg3);color:var(--accent-2);display:grid;place-items:center;border:4px solid var(--sheet)}
.swapmid svg{width:16px;height:16px}
.select{display:flex;align-items:center;gap:6px;background:var(--bg3);border-radius:12px;padding:4px 10px 4px 4px;font-weight:700;font-size:14px}
.select .coin{width:24px;height:24px;font-size:10px}
.qr{background:#fff;padding:14px;border-radius:18px;width:max-content;margin:4px auto 14px}
.qr img,.qr canvas{display:block;width:188px!important;height:188px!important}
.addr{font-size:14px;word-break:break-all;text-align:center;background:var(--bg2);border:1px solid var(--line);padding:12px 14px;border-radius:14px;margin-bottom:12px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ranges{display:flex;gap:6px;margin:6px 0 14px}
.ranges button{flex:1;padding:7px 0;border-radius:10px;font-size:13px;font-weight:700;color:var(--hint)}
.ranges button[aria-pressed="true"]{background:var(--bg3);color:var(--text)}
.chart{width:100%;height:180px;display:block}
.done{text-align:center;padding:20px 0 8px}
.done .ok{width:72px;height:72px;border-radius:22px;background:var(--up);color:#000;display:grid;place-items:center;margin:0 auto 14px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.done .ok svg{width:34px;height:34px}
.done h3{font-size:24px;font-weight:800;margin:0 0 6px}
.done p{color:var(--hint);margin:0 0 20px;font-size:14px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* wallets */
.wrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.wrow[aria-current="true"]{border-color:var(--accent)}
.wrow .wav{width:40px;height:40px;border-radius:12px;background:var(--bg3);display:grid;place-items:center;font-weight:800;color:var(--accent-2);flex:none}
.wrow .mid{flex:1;min-width:0}
.wrow .mid b{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700}
.wrow .mid small{display:block;font-size:12px;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbadge{font-size:10px;font-weight:700;color:var(--hint);background:var(--bg3);padding:2px 7px;border-radius:6px}
.mini{width:32px;height:32px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;color:var(--hint);flex:none}
.mini svg{width:15px;height:15px}
.wact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.warn{background:var(--down-bg);border:1px solid rgba(255,86,102,.3);color:#FF8A96;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:12px}
.phrase{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.phrase span{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.phrase span i{color:var(--hint);font-style:normal;width:18px;text-align:right;font-size:12px}
.notice{text-align:center;padding:16px 0 10px;color:var(--hint);font-size:14px;line-height:1.5}
.notice .ic{width:60px;height:60px;border-radius:18px;background:var(--bg2);display:grid;place-items:center;margin:0 auto 12px;color:var(--accent-2)}
.notice .ic svg{width:26px;height:26px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--bg3);color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}

/* welcome / onboarding */
.welcome{position:fixed;inset:0;z-index:50;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding:0 24px calc(34px + env(safe-area-inset-bottom,0px))}
.wl-bg{position:absolute;inset:0;background:radial-gradient(120% 75% at 50% -5%, rgba(247,167,7,.30), transparent 62%);pointer-events:none}
.wl-coins{position:absolute;inset:0;top:0;height:58%;pointer-events:none}
.wl-coins .c{position:absolute;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.14);animation:wlfloat 6s ease-in-out infinite}
.wl-coins .c1{background:#0098EA;left:16%;top:20%;animation-delay:0s}
.wl-coins .c2{background:#F7931A;right:14%;top:14%;width:62px;height:62px;animation-delay:-1.4s}
.wl-coins .c3{background:#26A17B;left:26%;top:52%;width:46px;height:46px;animation-delay:-2.6s}
.wl-coins .c4{background:#627EEA;right:20%;top:50%;animation-delay:-3.6s}
.wl-coins .c5{background:#EF0027;left:46%;top:30%;width:44px;height:44px;animation-delay:-2s}
.wl-card{position:relative;z-index:1;text-align:center;animation:wlup .6s cubic-bezier(.2,.8,.2,1)}
.wl-logo{width:76px;height:76px;border-radius:24px;margin:0 auto 20px;background:linear-gradient(135deg,#F7A707,#FFD36B);display:grid;place-items:center;color:#000;box-shadow:0 14px 44px rgba(247,167,7,.42)}
.wl-logo svg{width:40px;height:40px}
.welcome h1{font-size:33px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
.welcome p{color:var(--hint);font-size:15px;line-height:1.55;margin:0 auto 26px;max-width:330px}
.wl-link{display:block;width:100%;margin-top:10px;color:var(--hint);font-weight:600;padding:12px}
@keyframes wlfloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(4deg)}}
@keyframes wlup{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="acct" id="acctBtn" aria-label="Выбрать кошелёк"><span class="ava" id="ava">V</span><span id="uname">Кошелёк</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="flex:none"><path d="M6 9l6 6 6-6"/></svg></button>
    <span class="sp"></span>
    <button class="icon-btn" data-open="receive" aria-label="Показать QR-код"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg></button>
    <button class="icon-btn" id="eyeBtn" aria-label="Скрыть баланс"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>

  <div id="home">
    <section class="card">
      <div class="bal-label">Общая стоимость активов, USD</div>
      <div class="bal-num num" id="total">$0</div>
      <div class="pnl">PnL за 24 ч <span class="num" id="pnlv"></span><span class="chg num" id="delta"></span></div>
      <svg class="tape" id="tape" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true"></svg>
    </section>

    <nav class="actions">
      <button class="act" data-open="send"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 17L17 7M8 7h9v9"/></svg></span>Отправить</button>
      <button class="act" data-open="receive"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M17 7L7 17M16 17H7V8"/></svg></span>Получить</button>
      <button class="act" data-open="swap"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg></span>Обменять</button>
      <button class="act" data-nav="market"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 19h16M7 15l4-5 3 3 5-6"/></svg></span>Рынок</button>
    </nav>

    <div class="sec">
      <div class="seg" role="tablist">
        <button role="tab" aria-selected="true" data-tab="assets">Токены</button>
        <button role="tab" aria-selected="false" data-tab="history">История</button>
      </div>
      <small id="count"></small>
    </div>
  </div>

  <div id="marketHead" class="hide">
    <h1 class="page">Рынок</h1>
    <div class="colhead"><span>Токен / цена</span><span>Изм. 24 ч</span></div>
  </div>

  <div id="list"></div>
  <p class="demo" id="footnote">Цены загружаются…</p>
</div>

<nav class="nav"><div class="nav-in">
  <button data-nav="home" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/><path d="M6 6V5a2 2 0 0 1 2-2h10"/></svg>Кошелёк</button>
  <button data-nav="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16M7 15l4-5 3 3 5-6"/></svg>Рынок</button>
  <button data-open="swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>Обмен</button>
  <button data-nav="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>История</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<div id="welcome" class="welcome hide">
  <div class="wl-bg"></div>
  <div class="wl-coins">
    <span class="c c1">TON</span><span class="c c2">₿</span><span class="c c3">$</span><span class="c c4">Ξ</span><span class="c c5">T</span>
  </div>
  <div class="wl-card">
    <div class="wl-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2z"/><path d="M12 7l4 2.5v5L12 17l-4-2.5v-5L12 7z"/></svg></div>
    <h1>Bybit WEB3</h1>
    <p>Мультивалютный крипто-кошелёк прямо в Telegram. Храните, отслеживайте и отправляйте TON, USDT, BTC, ETH и другие — в реальном времени.</p>
    <button class="primary" id="wlCreate">Создать кошелёк</button>
    <button class="wl-link" id="wlConnect">У меня уже есть кошелёк</button>
  </div>
</div>

<script>

/* ---------- Real on-chain balance (read-only, public API) ---------- */
async function fetchTonBalances(address){
  const out={};
  try{
    const acc=await (await fetch(`https://tonapi.io/v2/accounts/${encodeURIComponent(address)}`)).json();
    if(acc && acc.balance!=null) out.TON=Number(acc.balance)/1e9;
    const jr=await (await fetch(`https://tonapi.io/v2/accounts/${encodeURIComponent(address)}/jettons`)).json();
    for(const b of ((jr&&jr.balances)||[])){
      const sym=((b.jetton&&b.jetton.symbol)||'').toUpperCase();
      const dec=(b.jetton&&b.jetton.decimals!=null)?b.jetton.decimals:9;
      if(sym && A(sym)) out[sym]=Number(b.balance)/Math.pow(10,dec);
    }
  }catch(e){}
  return out;
}
async function fetchTronBalances(address){
  const out={};
  try{
    const r=await fetch(`https://api.trongrid.io/v1/accounts/${encodeURIComponent(address)}`);
    const j=await r.json();
    const d=j&&j.data&&j.data[0];
    if(d){
      if(d.balance!=null) out.TRX=Number(d.balance)/1e6;
      const USDT_TRC20='TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
      for(const m of (d.trc20||[])){ if(m[USDT_TRC20]!=null) out.USDT=Number(m[USDT_TRC20])/1e6; }
    }
  }catch(e){}
  return out;
}
async function fetchTonHistory(address){
  try{
    const r=await fetch(`https://tonapi.io/v2/accounts/${encodeURIComponent(address)}/events?limit=20`);
    const j=await r.json();
    const al=String(address).toLowerCase();
    const out=[];
    for(const ev of ((j&&j.events)||[])){
      for(const ac of (ev.actions||[])){
        const tt=ac.TonTransfer; if(!tt) continue;
        const rec=((tt.recipient&&tt.recipient.address)||'').toLowerCase();
        const isIn=rec===al;
        const other=isIn?((tt.sender&&tt.sender.address)||''):((tt.recipient&&tt.recipient.address)||'');
        out.push({type:isIn?'in':'out', sym:'TON', amt:Number(tt.amount)/1e9, who:other?other.slice(0,4)+'…'+other.slice(-4):'—', t:(ev.timestamp||0)*1000});
      }
    }
    return out.length?out:null;
  }catch(e){ return null; }
}
async function refreshWallet(w){
  if(!w || !w.addr) return;
  let live=null, src=null;
  if(w.addr.TON){ live=await fetchTonBalances(w.addr.TON); src='TON'; }
  else if(w.addr.TRON){ live=await fetchTronBalances(w.addr.TRON); src='TRON'; }
  else return;
  if(live && Object.keys(live).length){
    if(live.TON!=null) w.bal.TON=live.TON;
    if(live.TRX!=null) w.bal.TRX=live.TRX;
    if(live.USDT!=null){ if(!w.usdt) w.usdt={TON:0,TRON:0,BNB:0,APT:0}; w.usdt[src]=live.USDT; }
    w.live=true; save(); render();
  } else if(w.watch) toast('Не удалось получить баланс');
  if(w.connected && w.addr.TON){ const h=await fetchTonHistory(w.addr.TON); if(h){ w.history=h; save(); render(); } }
}

/* ---------- Format ---------- */
const usd=(v,dp)=>'$'+v.toLocaleString('ru-RU',{minimumFractionDigits:dp??(v<1?4:2),maximumFractionDigits:dp??(v<1?4:2)});
const amt=(v,a)=>v.toLocaleString('ru-RU',{maximumFractionDigits:a.dp})+' '+a.sym;
const pct=v=>(v>=0?'+':'')+v.toFixed(2).replace('.',',')+'%';
const mask=s=>S.hidden?'••••':s;
const ago=t=>{ const d=(Date.now()-t)/60000; if(d<1)return'только что'; if(d<60)return Math.floor(d)+' мин назад'; if(d<1440)return Math.floor(d/60)+' ч назад'; return new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortAddr=x=>!x?'':(x.length>14?x.slice(0,5)+'…'+x.slice(-5):x);
function coin(a){
  const u=ICON[a.sym]||[], l=a.sym.slice(0,a.sym.length>3?2:1);
  const img=u.length?`<img src="${u[0]}" alt="" loading="lazy" data-fb='${JSON.stringify(u.slice(1))}' onerror="coinErr(this)">`:'';
  return `<span class="coin" style="background:${a.color}"><i>${l}</i>${img}</span>`;
}
function path(vals,w,h,pad=2){
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  return vals.map((v,i)=>`${i?'L':'M'}${(i/(vals.length-1)*w).toFixed(1)},${(pad+(h-pad*2)*(1-(v-mn)/rg)).toFixed(1)}`).join('');
}

/* ---------- Live stream (Binance WebSocket, no key) ---------- */
const BNB={TON:'tonusdt',BTC:'btcusdt',ETH:'ethusdt',TRX:'trxusdt',NOT:'notusdt'};
let ws=null, wsLive=false, rPending=false;
function scheduleRender(){ if(rPending) return; rPending=true; requestAnimationFrame(()=>{ rPending=false; render(); if(openKind==='asset') updateAssetLive(); }); }
function startWs(){
  try{
    const streams=Object.values(BNB).map(s=>s+'@ticker').join('/');
    ws=new WebSocket('wss://stream.binance.com:9443/stream?streams='+streams);
    ws.onmessage=ev=>{
      try{
        const m=JSON.parse(ev.data).data; if(!m||!m.s) return;
        const pair=m.s.toLowerCase(), sym=Object.keys(BNB).find(k=>BNB[k]===pair); if(!sym) return;
        const a=A(sym); if(!a) return;
        a.price=parseFloat(m.c); if(m.P!=null) a.chg=parseFloat(m.P);
        a.hist.push(a.price); if(a.hist.length>120) a.hist.shift();
        wsLive=true; pricesLive=true;
        const f=document.getElementById('footnote'); if(f && f.textContent!=='Реальное время · Binance') f.textContent='Реальное время · Binance';
        scheduleRender();
      }catch(e){}
    };
    ws.onclose=()=>{ wsLive=false; setTimeout(startWs,4000); };
    ws.onerror=()=>{ try{ ws.close() }catch(e){} };
  }catch(e){}
}

const chips=sel=>`<div class="chips">${MARKET.map(a=>`<button class="chip" data-pick="${a.sym}" aria-pressed="${a.sym===sel}">${coin(a)}${a.sym}</button>`).join('')}</div>`;

function watchNotice(){
  body.innerHTML=head('Только просмотр')+`<div class="notice"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
    <p>Это привязанный адрес для наблюдения. Отправка и обмен недоступны — переключитесь на кошелёк, которым владеете.</p></div>
    <button class="primary" data-close>Понятно</button>`;
}

const uNetChips=sel=>`<div class="chips">${USDT_NETS.map(n=>`<button class="chip" data-unet="${n.k}" aria-pressed="${n.k===sel}"><span class="coin" style="background:${n.color};width:22px;height:22px;font-size:9px"><i>${n.label[0]}</i></span>${n.label}</button>`).join('')}</div>`;
function sendView(){
  const a=A(ctx.sym||'TON'); ctx.sym=a.sym;
  const conn=!!W().connected;
  if(conn && a.sym!=='TON'){
    body.innerHTML=head('Отправить')+chips(a.sym)+`<div class="notice"><div class="ic">${CPIC}</div><p>Для подключённого кошелька реальный перевод сейчас доступен в TON. Жетоны и другие сети — через приложение вашего кошелька.</p></div><button class="ghost" data-close>Понятно</button>`;
    body.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ ctx.sym=b.dataset.pick; ctx.unet=null; haptic('soft'); sendView(); });
    return;
  }
  const isU=a.sym==='USDT';
  if(isU && !ctx.unet) ctx.unet='TON';
  const un=isU?USDT_NETS.find(n=>n.k===ctx.unet):null;
  const fee=isU?un.fee:a.fee;
  const avail=isU?(usdtMap()[ctx.unet]||0):bal(a.sym);
  body.innerHTML=head('Отправить')+chips(a.sym)+(isU?uNetChips(ctx.unet):'')+(conn?`<p class="demo" style="text-align:left;margin:0 2px 10px">Перевод подпишется в вашем кошельке через TON Connect.</p>`:'')+`
    <div class="field"><label for="to">Адрес получателя${isU?' · '+un.full:''}</label><input id="to" placeholder="${isU?'Адрес в сети '+esc(un.label):'UQ… или @username'}" autocomplete="off" value="${esc(ctx.to||'')}"></div>
    <div class="field"><label for="am">Сумма · доступно ${amt(avail,a)}</label>
      <div class="line"><input id="am" class="big num" inputmode="decimal" placeholder="0" value="${ctx.am||''}"><button class="pill" id="max">Макс.</button></div></div>
    <div class="kv"><span>≈ в долларах</span><b id="usdv" class="num">$0,00</b></div>
    <div class="kv"><span>Сеть</span><b>${isU?un.full:a.net}</b></div>
    <div class="kv"><span>Комиссия сети</span><b class="num">${amt(fee,a)}</b></div>
    <div class="err" id="err"></div>
    <button class="primary" id="go" disabled>Отправить</button>`;
  const to=body.querySelector('#to'), am=body.querySelector('#am'), gob=body.querySelector('#go'), err=body.querySelector('#err');
  const check=()=>{
    ctx.to=to.value; ctx.am=am.value;
    const v=parseFloat(am.value.replace(',','.'))||0;
    body.querySelector('#usdv').textContent=usd(v*a.price,2);
    let e='';
    if(v>0&&v+fee>avail) e='Недостаточно средств с учётом комиссии';
    else if(to.value&&to.value.trim().length<5) e='Проверьте адрес получателя';
    err.textContent=e; gob.disabled=!!e||!v||!to.value.trim();
  };
  to.oninput=check; am.oninput=check;
  body.querySelector('#max').onclick=()=>{ am.value=String(Math.max(0,+(avail-fee).toFixed(a.dp||2))); check(); };
  body.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ ctx.sym=b.dataset.pick; ctx.am=''; ctx.unet=null; haptic('soft'); sendView(); });
  body.querySelectorAll('[data-unet]').forEach(b=>b.onclick=()=>{ ctx.unet=b.dataset.unet; ctx.am=''; haptic('soft'); sendView(); });
  gob.onclick=()=>{
    const v=parseFloat(am.value.replace(',','.'));
    const raw=to.value.trim(), who=raw.length>12?raw.slice(0,4)+'…'+raw.slice(-4):raw;
    if(conn){
      gob.disabled=true; gob.textContent='Подтвердите в кошельке…';
      realSendTon(raw, v).then(ok=>{
        if(ok){ notify(); W().history.unshift({type:'out',sym:'TON',amt:v,who,t:Date.now()}); save(); render(); setTimeout(()=>refreshWallet(W()),6000);
          body.innerHTML=`<div class="done"><div class="ok">${OK}</div><h3 class="num">−${amt(v,a)}</h3><p>Отправлено на ${esc(who)}</p><button class="ghost" data-close>Готово</button></div>`;
        } else { gob.disabled=false; gob.textContent='Отправить'; toast('Перевод не выполнен'); }
      });
      return;
    }
    if(isU){ const m=usdtMap(); m[ctx.unet]=+(((m[ctx.unet]||0)-v-fee)).toFixed(6); }
    else { W().bal[a.sym]=+(bal(a.sym)-v-a.fee).toFixed(8); }
    W().history.unshift({type:'out',sym:a.sym,amt:v,who,net:isU?un.label:undefined,t:Date.now()}); save(); render(); notify();
    body.innerHTML=`<div class="done"><div class="ok">${OK}</div><h3 class="num">−${amt(v,a)}</h3><p>Отправлено на ${esc(who)}${isU?' · '+esc(un.label):''}</p><button class="ghost" data-close>Готово</button></div>`;
  };
  check();
}

const NETNAME={TON:'TON',BTC:'Bitcoin',ETH:'Ethereum',TRON:'TRON',BNB:'BNB Smart Chain',APT:'Aptos'};
function receiveView(){
  const s=ctx.sym||'TON'; ctx.sym=s;
  const a=A(s), isU=s==='USDT';
  if(isU && !ctx.unet) ctx.unet='TON';
  const un=isU?USDT_NETS.find(n=>n.k===ctx.unet):null;
  const key=isU?ctx.unet:a.net;
  const address=W().addr[key];
  const netLabel=isU?un.full:(key==='TON'?(s==='TON'?'TON':'TON (Jetton)'):NETNAME[key]);
  const netPlain=isU?un.label:NETNAME[key];
  let main;
  if(address){
    main=`<div class="qr" id="qr"></div>
      <div class="kv"><span>Сеть</span><b>${netLabel}</b></div>
      <div class="addr">${address}</div>
      <div class="two"><button class="ghost" id="cp">Скопировать</button><button class="primary" style="margin:0" id="sh">Поделиться</button></div>
      <p class="demo">Отправляйте на этот адрес только ${s} в сети ${netPlain}.</p>`;
  } else {
    main=`<div class="notice"><div class="ic">${CPIC}</div><p>Для сети ${netPlain} у этого кошелька нет адреса. Выберите другую сеть или создайте кошелёк.</p></div>`;
  }
  body.innerHTML=head('Получить')+chips(s)+(isU?uNetChips(ctx.unet):'')+main;
  body.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ ctx.sym=b.dataset.pick; ctx.unet=null; haptic('soft'); receiveView(); });
  body.querySelectorAll('[data-unet]').forEach(b=>b.onclick=()=>{ ctx.unet=b.dataset.unet; haptic('soft'); receiveView(); });
  if(address){
    try{ new QRCode(body.querySelector('#qr'),{text:address,width:376,height:376,colorDark:'#000000',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M}); }catch(e){ const q=body.querySelector('#qr'); if(q) q.style.display='none'; }
    body.querySelector('#cp').onclick=()=>copy(address);
    body.querySelector('#sh').onclick=()=>{
      if(tg&&tg.openTelegramLink){ try{ tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(address)+'&text='+encodeURIComponent('Мой адрес '+s)); return; }catch(e){} }
      if(navigator.share) navigator.share({text:`Мой адрес ${s}: ${address}`}).catch(()=>{}); else copy(address);
    };
  }
}

function swapView(){
  ctx.from=ctx.from||'USDT'; ctx.to=ctx.to||'TON';
  const f=A(ctx.from), t=A(ctx.to);
  const sel=(a,k)=>`<button class="select" data-cycle="${k}">${coin(a)}${a.sym}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg></button>`;
  body.innerHTML=head('Обменять')+`
    <div class="field"><label for="fa">Отдаёте · доступно ${amt(bal(f.sym),f)}</label><div class="line"><input id="fa" class="big num" inputmode="decimal" placeholder="0" value="${ctx.fa||''}">${sel(f,'from')}</div></div>
    <div class="swapmid"><button id="flip" aria-label="Поменять местами"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg></button></div>
    <div class="field"><label>Получаете</label><div class="line"><input class="big num" id="ta" readonly value="0">${sel(t,'to')}</div></div>
    <div class="kv"><span>Курс</span><b class="num">1 ${f.sym} ≈ ${(f.price/t.price).toLocaleString('ru-RU',{maximumSignificantDigits:6})} ${t.sym}</b></div>
    <div class="kv"><span>Комиссия сервиса</span><b>0,5%</b></div>
    <div class="err" id="err"></div>
    <button class="primary" id="go" disabled>Обменять</button>`;
  const fa=body.querySelector('#fa'), ta=body.querySelector('#ta'), gob=body.querySelector('#go'), err=body.querySelector('#err');
  const calc=()=>{
    ctx.fa=fa.value; const v=parseFloat(fa.value.replace(',','.'))||0;
    const out=v*f.price/t.price*0.995; ctx.out=out;
    ta.value=out?out.toLocaleString('ru-RU',{maximumFractionDigits:Math.max(t.dp,4)}):'0';
    err.textContent=v>bal(f.sym)?'Недостаточно '+f.sym:'';
    gob.disabled=!v||v>bal(f.sym);
  };
  fa.oninput=calc;
  body.querySelector('#flip').onclick=()=>{ [ctx.from,ctx.to]=[ctx.to,ctx.from]; ctx.fa=''; haptic(); swapView(); };
  body.querySelectorAll('[data-cycle]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.cycle, other=k==='from'?ctx.to:ctx.from;
    const list=MARKET.map(a=>a.sym).filter(s=>s!==other);
    ctx[k]=list[(list.indexOf(ctx[k])+1)%list.length]; haptic('soft'); swapView();
  });
  gob.onclick=()=>{
    const v=parseFloat(fa.value.replace(',','.'));
    credit(f.sym,-v); credit(t.sym,+ctx.out);
    W().history.unshift({type:'swap',sym:f.sym,amt:v,to:t.sym,toAmt:+ctx.out.toFixed(8),t:Date.now()}); save(); render(); notify();
    ctx.fa='';
    body.innerHTML=`<div class="done"><div class="ok">${OK}</div><h3 class="num">+${amt(ctx.out,t)}</h3><p>Обменяно ${amt(v,f)}</p><button class="ghost" data-close>Готово</button></div>`;
  };
  calc();
}

  openKind='wallets';

  const only=S.wallets.length<=1;
  body.innerHTML=head('Кошелёк')+`
    <div class="field"><label>Название</label><input id="rn" value="${esc(w.name)}" maxlength="24"></div>
    <button class="primary" id="sv">Сохранить</button>
    <button class="ghost" id="bk" style="margin-top:8px">Назад</button>
    <button class="ghost danger" id="del" style="margin-top:8px" ${only?'disabled':''}>Удалить кошелёк</button>
    ${only?'<p class="demo">Нельзя удалить единственный кошелёк.</p>':''}`;

function linkView(){
  openKind='link';
  body.innerHTML=head('Привязать адрес')+`
    <div class="field"><label>Название</label><input id="ln" placeholder="Напр. Холодный кошелёк" maxlength="24" value="${esc(ctx.lname||'')}"></div>
    <div class="field"><label>Публичный адрес</label><input id="la" placeholder="UQ… / 0x… / bc1…" autocomplete="off" value="${esc(ctx.laddr||'')}"></div>
    <div class="warn">Вставляйте только <b>публичный адрес</b> для наблюдения. Никогда не вводите сюда seed-фразу или приватный ключ — ни здесь, ни в любом другом приложении.</div>
    <div class="err" id="err"></div>
    <button class="primary" id="go" disabled>Привязать</button>
    <button class="ghost" id="bk" style="margin-top:8px">Назад</button>`;
  const ln=body.querySelector('#ln'), la=body.querySelector('#la'), gob=body.querySelector('#go'), err=body.querySelector('#err');
  const check=()=>{
    ctx.lname=ln.value; ctx.laddr=la.value;
    const v=la.value.trim(); let e='';
    if(v && v.split(/\s+/).length>=6) e='Похоже на seed-фразу. Вставьте публичный адрес, а не секретную фразу.';
    else if(v && v.length<8) e='Адрес слишком короткий';
    err.textContent=e; gob.disabled=!!e||!v;
  };
  ln.oninput=check; la.oninput=check;
  body.querySelector('#bk').onclick=()=>walletsView();
  gob.onclick=()=>{
    const v=la.value.trim();
    const net=v.startsWith('0x')?'ETH':/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(v)?'TRON':(v.startsWith('bc1')||/^[13]/.test(v))?'BTC':'TON';
    const addr={}; addr[net]=v;
    const w={id:newId(),name:(ln.value.trim()||'Отслеживаемый'),watch:true,addr,bal:{},history:[]};
    S.wallets.push(w); S.active=w.id; save(); notify(); render();
    toast('Адрес привязан'); walletsView();
    if(net==='TON'||net==='TRON') refreshWallet(w);
  };
  check();
}

/* ---------- Asset detail ---------- */
function seeded(seed){ let x=0; for(const c of seed) x=(x*31+c.charCodeAt(0))>>>0; return ()=>((x=(x*1664525+1013904223)>>>0)/4294967296); }
const RANGES={'1Д':{n:48,v:0.012},'1Н':{n:56,v:0.025},'1М':{n:60,v:0.05},'1Г':{n:72,v:0.12}};
function series(a,r){
  if(a.sym==='USDT') return Array.from({length:RANGES[r].n},(_,i)=>1+Math.sin(i)*0.0008);
  const rnd=seeded(a.sym+r),{n,v}=RANGES[r]; const arr=[1];
  for(let i=1;i<n;i++) arr.push(arr[i-1]*(1+(rnd()-0.48)*v*0.35));
  const k=a.price/arr[n-1]; return arr.map(x=>x*k);
}

  ctx.realSeries=null; updateAssetLive(); loadAssetChart();

const KL={'1Д':['15m',96],'1Н':['1h',168],'1М':['4h',180],'1Г':['1d',365]};
async function fetchKlines(sym,range){
  if(sym==='USDT' || !BNB[sym]) return null;
  try{
    const [iv,lim]=KL[range];
    const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${BNB[sym].toUpperCase()}&interval=${iv}&limit=${lim}`);
    if(!r.ok) return null;
    const j=await r.json();
    const closes=j.map(k=>parseFloat(k[4])).filter(x=>!isNaN(x));
    return closes.length>1?closes:null;
  }catch(e){ return null; }
}
async function loadAssetChart(){
  const sym=ctx.sym, range=ctx.range;
  const s=await fetchKlines(sym,range);
  if(openKind==='asset' && ctx.sym===sym && ctx.range===range){ ctx.realSeries=s; updateAssetLive(); }
}
function updateAssetLive(){
  const a=A(ctx.sym);
  let s=(ctx.realSeries&&ctx.realSeries.length)?ctx.realSeries.slice():series(a,ctx.range);
  if(a.sym!=='USDT') s[s.length-1]=a.price;
  const ch=(s[s.length-1]/s[0]-1)*100, up=ch>=0;
  const hex=up?'#1FD187':'#FF5666', p=path(s,400,180,10);
  body.querySelector('#ap').textContent=usd(a.price);
  const c=body.querySelector('#ac'); c.className='chg num '+(up?'up':'down'); c.textContent=pct(ch)+' за '+({'1Д':'день','1Н':'неделю','1М':'месяц','1Г':'год'})[ctx.range];
  const av=body.querySelector('#av'); if(av) av.textContent=mask(usd(bal(a.sym)*a.price,2));
  const grid=[45,90,135].map(y=>`<line x1="0" x2="400" y1="${y}" y2="${y}" stroke="#26272B" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>`).join('');
  body.querySelector('#ach').innerHTML=`${grid}<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hex}" stop-opacity=".28"/><stop offset="1" stop-color="${hex}" stop-opacity="0"/></linearGradient></defs><path d="${p}L400,180L0,180Z" fill="url(#ag)"/><path d="${p}" fill="none" stroke="${hex}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>`;
}

/* ---------- Misc ---------- */
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),1600); }
function copy(txt){
  const ok=()=>{ toast('Скопировано'); notify(); };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); ok();}catch(e){toast('Не удалось скопировать');} ta.remove(); };
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(ok).catch(fallback); else fallback();
}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open));
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
document.getElementById('acctBtn').onclick=()=>openSheet('wallets');
document.getElementById('list').addEventListener('click',e=>{ const r=e.target.closest('[data-asset]'); if(r) openSheet('asset',{sym:r.dataset.asset}); });
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab==='history'?'history':'home'));
document.getElementById('eyeBtn').onclick=()=>{ S.hidden=!S.hidden; save(); haptic(); render(); };

function showWelcome(){
  const el=document.getElementById('welcome'); if(!el) return;
  el.classList.remove('hide');
  el.querySelector('#wlCreate').onclick=()=>{ haptic(); el.classList.add('hide'); toast('Кошелёк готов'); };
  el.querySelector('#wlConnect').onclick=()=>{ haptic(); el.classList.add('hide'); tonConnect(); };
}
async function init(){
  const loaded=await DB.load();
  const fresh=!loaded || !Array.isArray(loaded.wallets) || !loaded.wallets.length;
  if(fresh){ const w=DEFWALLET(); S={hidden:false, active:w.id, wallets:[w]}; save(); } else S=loaded;
  if(!S.wallets.find(w=>w.id===S.active)) S.active=S.wallets[0].id;
  render();
  if(fresh) showWelcome();
  tonConnectInit();
  fetchPrices(); startWs();
  setInterval(()=>{ if(!wsLive) fetchPrices(); }, 60000);
  setInterval(()=>{ const w=W(); if(w && (w.watch||w.connected)) refreshWallet(w); }, 30000);
  const w=W(); if(w && (w.watch||w.connected)) refreshWallet(w);
}
init();
</script>
